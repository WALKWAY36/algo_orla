[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algo_orla"
version = "0.1.0"
description = "Educational, class-based implementations of RL/post-training objectives for LLMs."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "WALKWAY36"}]
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
hf = ["transformers>=4.45"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
